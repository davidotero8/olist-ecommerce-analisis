services:
  db:
    image: postgres:16
    container_name: olist_pg
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist_local
      POSTGRES_DB: olist
    ports:
      - "5433:5432"   # 5433 para no chocar con otros Postgres que tengas
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/clean:/data/clean:ro   # los CSV limpios, visibles desde dentro del contenedor

volumes:
  pgdata:
